[workspace]
resolver = "2"
members = ["*"]
exclude = ["target", "deploy", "scripts"]

[workspace.dependencies]
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"
stylus-sdk = "0.10.8"
stylus-core = "0.10.8"
sha2 = { version = "0.10", default-features = false }
tiny-keccak = { version = "2.0", features = ["keccak"] }
memorychain-common = { path = "memorychain-common" }

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = 3
