upstream backend {
  server hono:3001;
}

upstream frontend {
  server nextjs:3000;
}

server {
  listen 80;
  server_name _;

  # ── Backend API ─────────────────────────────────────────────
  # Todas las rutas /api/* van al hono, eliminando el prefijo /api
  location /api/ {
    proxy_pass http://backend/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts generosos para requests de AI (streams largas)
    proxy_read_timeout    300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;

    # Soporte para SSE / streaming de AI
    proxy_buffering off;
    proxy_cache     off;
  }

  # ── Archivos estáticos Next.js (_next/static) ───────────────
  # Los servidores con caché agresiva para assets hasheados
  location /_next/static/ {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # Assets con hash en el nombre → caché por 1 año
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ── Frontend Next.js ────────────────────────────────────────
  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;

    # Soporte para HMR (WebSocket) en dev, SSE en prod
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
  }
}
