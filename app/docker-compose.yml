version: "3.8"

services:
  ipfs:
    image: ipfs/kubo:latest
    container_name: memorychain-ipfs
    ports:
      - "5001:5001"
      - "8080:8080"
      - "4001:4001"
      - "4001:4001/udp"
    volumes:
      - ipfs-data:/data/ipfs
    environment:
      - IPFS_PROFILE=server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: memorychain-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ipfs-data:
  redis-data:
